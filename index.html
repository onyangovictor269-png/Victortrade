<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VictorTrade</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><h1>VictorTrade</h1><small>Deriv Market Analysis Workspace</small></div><span id="status" class="pill">DISCONNECTED</span></header>
<main><section class="card controls"><label>Market<select id="symbol"><option>1HZ100V</option><option>R_10</option><option>R_25</option><option>R_50</option><option>R_75</option><option>R_100</option></select></label><label>History<input id="count" type="number" value="100" min="30" max="500"></label><button id="start">Start Analysis</button><button id="stop" disabled>Stop</button></section>
<section class="grid"><div class="card"><h2>Market</h2><div id="price">—</div><div id="updated">Waiting for data</div></div><div class="card"><h2>Signal</h2><div id="signal">WAIT</div><div id="confidence">0%</div><p id="reason">Start analysis to calculate a signal.</p></div></section>
<section class="card"><h2>Live prices</h2><canvas id="chart" height="220"></canvas></section>
<section class="card"><h2>Risk controls</h2><div class="risk"><label>Stake<input id="stake" type="number" value="1" min="0.35" step="0.01"></label><label>Max trades/day<input id="maxTrades" type="number" value="10" min="1"></label><label>Daily loss limit<input id="maxLoss" type="number" value="5" min="0" step="0.1"></label></div><p class="note">Paper analysis only. No automatic real-money orders are placed by this page.</p></section></main>
<script src="app.js"></script></body></html>
